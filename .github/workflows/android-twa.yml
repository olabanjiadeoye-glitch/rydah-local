name: Android TWA Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "release/android/**"
      - "public/rydah-icon.svg"
      - ".github/workflows/android-twa.yml"

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        id: setup_node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java
        id: setup_java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Android API 36
        id: android_sdk
        run: |
          mkdir -p ci-status
          set +e
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            if [ ! -x "$SDKMANAGER" ]; then
              SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path "*/bin/sdkmanager" 2>/dev/null | sort | tail -n 1)"
            fi
            if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
              echo "Unable to locate sdkmanager under $ANDROID_HOME/cmdline-tools"
              find "$ANDROID_HOME" -maxdepth 4 -type f -name sdkmanager -print || true
              exit 127
            fi
            echo "sdkmanager path: $SDKMANAGER"
            echo "sdkmanager version:"
            "$SDKMANAGER" --version
            echo "Installing API 36:"
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" --install "platforms;android-36"
          } 2>&1 | tee ci-status/android-sdk.log
          EXIT_CODE=${PIPESTATUS[0]}
          exit $EXIT_CODE

      - name: Install Bubblewrap
        id: bubblewrap_install
        run: npm install --global @bubblewrap/cli

      - name: Generate Android project
        id: generate
        run: |
          mkdir -p build/android-twa
          cp release/android/twa-manifest.json build/android-twa/twa-manifest.json
          cd build/android-twa
          bubblewrap update --skipVersionUpgrade --manifest=. --androidSdkPath="$ANDROID_HOME"

      - name: Build unsigned Android App Bundle
        id: bundle
        run: |
          cd build/android-twa
          bubblewrap build --skipPwaValidation --skipSigning --manifest=.

      - name: Generate Google Play image assets
        id: play_assets
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          mkdir -p build/play-assets
          rsvg-convert -w 512 -h 512 public/rydah-icon.svg -o build/play-assets/rydah-icon-512.png
          rsvg-convert -w 1024 -h 500 release/google-play/feature-graphic.svg -o build/play-assets/rydah-feature-1024x500.png

      - name: Upload Android build artifacts
        id: upload_artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rydah-local-android-unsigned
          if-no-files-found: error
          path: |
            build/android-twa/app-release-bundle.aab
            build/android-twa/app-release-unsigned.apk
            build/android-twa/app-release-signed.apk
            build/android-twa/twa-manifest.json
            build/play-assets/rydah-icon-512.png
            build/play-assets/rydah-feature-1024x500.png

      - name: Publish CI prerelease
        id: prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-ci-${{ github.run_number }}"
          gh release create "$TAG" \
            build/android-twa/app-release-bundle.aab \
            build/play-assets/rydah-icon-512.png \
            build/play-assets/rydah-feature-1024x500.png \
            --repo "${{ github.repository }}" \
            --title "Rydah Android CI build ${{ github.run_number }}" \
            --notes "Unsigned Android App Bundle for package online.rydahlocal.app. CI validation only; not ready for Play upload until permanent signing is configured." \
            --prerelease

      - name: Record Android CI status
        if: always()
        env:
          BUILD_STATUS: ${{ job.status }}
          RUN_NUMBER: ${{ github.run_number }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir -p ci-status
          cat > ci-status/android-twa.json <<EOF
          {
            "workflow": "Android TWA Build",
            "status": "$BUILD_STATUS",
            "runNumber": "$RUN_NUMBER",
            "sourceSha": "$SOURCE_SHA",
            "packageId": "online.rydahlocal.app",
            "versionCode": 1,
            "versionName": "0.1.0",
            "steps": {
              "setupNode": "${{ steps.setup_node.outcome }}",
              "setupJava": "${{ steps.setup_java.outcome }}",
              "androidSdk": "${{ steps.android_sdk.outcome }}",
              "bubblewrapInstall": "${{ steps.bubblewrap_install.outcome }}",
              "generateProject": "${{ steps.generate.outcome }}",
              "bundle": "${{ steps.bundle.outcome }}",
              "playAssets": "${{ steps.play_assets.outcome }}",
              "uploadArtifacts": "${{ steps.upload_artifacts.outcome }}",
              "prerelease": "${{ steps.prerelease.outcome }}"
            }
          }
          EOF
          git config user.name "rydah-ci"
          git config user.email "actions@users.noreply.github.com"
          git add ci-status/android-twa.json
          if [ -f ci-status/android-sdk.log ]; then git add ci-status/android-sdk.log; fi
          git commit -m "Record Android CI status [skip ci]" || true
          git push
