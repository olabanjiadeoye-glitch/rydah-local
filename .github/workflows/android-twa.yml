name: Android TWA Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "release/android/**"
      - "public/rydah-icon.svg"
      - ".github/workflows/android-twa.yml"

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Bubblewrap
        run: npm install --global @bubblewrap/cli

      - name: Generate Android project
        run: |
          mkdir -p build/android-twa
          cp release/android/twa-manifest.json build/android-twa/twa-manifest.json
          cd build/android-twa
          bubblewrap update --skipVersionUpgrade --manifest=. --androidSdkPath="$ANDROID_HOME"

      - name: Build unsigned Android App Bundle
        run: |
          cd build/android-twa
          bubblewrap build --skipPwaValidation --skipSigning --manifest=.

      - name: Generate Google Play image assets
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          mkdir -p build/play-assets
          rsvg-convert -w 512 -h 512 public/rydah-icon.svg -o build/play-assets/rydah-icon-512.png
          rsvg-convert -w 1024 -h 500 release/google-play/feature-graphic.svg -o build/play-assets/rydah-feature-1024x500.png

      - name: Upload Android build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rydah-local-android-unsigned
          if-no-files-found: error
          path: |
            build/android-twa/app-release-bundle.aab
            build/android-twa/app-release-unsigned.apk
            build/android-twa/app-release-signed.apk
            build/android-twa/twa-manifest.json
            build/play-assets/rydah-icon-512.png
            build/play-assets/rydah-feature-1024x500.png

      - name: Publish CI prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-ci-${{ github.run_number }}"
          gh release create "$TAG" \
            build/android-twa/app-release-bundle.aab \
            build/play-assets/rydah-icon-512.png \
            build/play-assets/rydah-feature-1024x500.png \
            --repo "${{ github.repository }}" \
            --title "Rydah Android CI build ${{ github.run_number }}" \
            --notes "Unsigned Android App Bundle for package online.rydahlocal.app. CI validation only; not ready for Play upload until permanent signing is configured." \
            --prerelease

      - name: Record Android CI status
        if: always()
        env:
          BUILD_STATUS: ${{ job.status }}
          RUN_NUMBER: ${{ github.run_number }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir -p ci-status
          cat > ci-status/android-twa.json <<EOF
          {
            "workflow": "Android TWA Build",
            "status": "$BUILD_STATUS",
            "runNumber": "$RUN_NUMBER",
            "sourceSha": "$SOURCE_SHA",
            "packageId": "online.rydahlocal.app",
            "versionCode": 1,
            "versionName": "0.1.0"
          }
          EOF
          git config user.name "rydah-ci"
          git config user.email "actions@users.noreply.github.com"
          git add ci-status/android-twa.json
          git commit -m "Record Android CI status [skip ci]" || true
          git push
