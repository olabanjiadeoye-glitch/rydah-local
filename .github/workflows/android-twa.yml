name: Android TWA Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "release/android/**"
      - "release/google-play/**"
      - "public/rydah-icon.svg"
      - ".github/workflows/android-twa.yml"

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Android project workspace
        id: prepare
        run: |
          mkdir -p build/android-twa
          cp release/android/twa-manifest.json build/android-twa/twa-manifest.json

      - name: Pull official Bubblewrap container
        id: bubblewrap_container
        run: docker pull ghcr.io/googlechromelabs/bubblewrap:latest

      - name: Generate Android project
        id: generate
        run: |
          docker run --rm \
            -v "$PWD/build/android-twa:/app" \
            -w /app \
            ghcr.io/googlechromelabs/bubblewrap:latest \
            update --skipVersionUpgrade

      - name: Build unsigned Android App Bundle
        id: bundle
        run: |
          docker run --rm \
            -v "$PWD/build/android-twa:/app" \
            -w /app \
            ghcr.io/googlechromelabs/bubblewrap:latest \
            build --skipPwaValidation --skipSigning

      - name: Confirm target SDK 36
        id: verify_target
        run: |
          grep -R "targetSdk.*36\|targetSdkVersion.*36" build/android-twa/app/build.gradle* build/android-twa/build.gradle* || {
            echo "Generated project does not visibly target Android API 36."
            exit 1
          }

      - name: Generate Google Play image assets
        id: play_assets
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          mkdir -p build/play-assets
          rsvg-convert -w 512 -h 512 public/rydah-icon.svg -o build/play-assets/rydah-icon-512.png
          rsvg-convert -w 1024 -h 500 release/google-play/feature-graphic.svg -o build/play-assets/rydah-feature-1024x500.png

      - name: Locate AAB
        id: locate_aab
        run: |
          AAB="$(find build/android-twa -type f -name '*.aab' | head -n 1)"
          if [ -z "$AAB" ]; then
            echo "No Android App Bundle was produced."
            find build/android-twa -maxdepth 5 -type f | sort | tail -n 200
            exit 1
          fi
          cp "$AAB" build/android-twa/rydah-local-unsigned.aab
          echo "aab=build/android-twa/rydah-local-unsigned.aab" >> "$GITHUB_OUTPUT"

      - name: Upload Android build artifacts
        id: upload_artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rydah-local-android-unsigned
          if-no-files-found: error
          path: |
            build/android-twa/rydah-local-unsigned.aab
            build/android-twa/twa-manifest.json
            build/play-assets/rydah-icon-512.png
            build/play-assets/rydah-feature-1024x500.png

      - name: Publish CI prerelease
        id: prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-ci-${{ github.run_number }}"
          gh release create "$TAG" \
            build/android-twa/rydah-local-unsigned.aab \
            build/play-assets/rydah-icon-512.png \
            build/play-assets/rydah-feature-1024x500.png \
            --repo "${{ github.repository }}" \
            --title "Rydah Android CI build ${{ github.run_number }}" \
            --notes "Unsigned Android App Bundle for package online.rydahlocal.app. CI validation only; permanent Play signing still needs to be configured." \
            --prerelease

      - name: Record Android CI status
        if: always()
        env:
          BUILD_STATUS: ${{ job.status }}
          RUN_NUMBER: ${{ github.run_number }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir -p ci-status
          cat > ci-status/android-twa.json <<EOF
          {
            "workflow": "Android TWA Build",
            "status": "$BUILD_STATUS",
            "runNumber": "$RUN_NUMBER",
            "sourceSha": "$SOURCE_SHA",
            "packageId": "online.rydahlocal.app",
            "versionCode": 1,
            "versionName": "0.1.0",
            "steps": {
              "prepare": "${{ steps.prepare.outcome }}",
              "bubblewrapContainer": "${{ steps.bubblewrap_container.outcome }}",
              "generateProject": "${{ steps.generate.outcome }}",
              "bundle": "${{ steps.bundle.outcome }}",
              "verifyTarget": "${{ steps.verify_target.outcome }}",
              "playAssets": "${{ steps.play_assets.outcome }}",
              "locateAab": "${{ steps.locate_aab.outcome }}",
              "uploadArtifacts": "${{ steps.upload_artifacts.outcome }}",
              "prerelease": "${{ steps.prerelease.outcome }}"
            }
          }
          EOF
          git config user.name "rydah-ci"
          git config user.email "actions@users.noreply.github.com"
          git add ci-status/android-twa.json
          git commit -m "Record Android CI status [skip ci]" || true
          git push
